<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/readiness-icon.svg"><title>JSON 静的Worker検証専用</title></head>
<body>
<h1>JSON 静的Worker検証専用</h1>
<p>合成データ専用。独自配置を採用。本体統合は保留。</p>
<p id="cache-status" role="status">資産取得前</p>
<section id="diagram-view" aria-labelledby="diagram-heading">
<h2 id="diagram-heading">JSON構造図（独自配置）</h2>
<p id="diagram-explanation">図の配置・折返しは、Mermaidソースの出力先で異なる場合があります。拡大するとラベルを読めます。</p>
<div class="toolbar" role="group" aria-label="図とソースの表示切替">
<button id="show-diagram" aria-pressed="true" aria-controls="diagram-viewport" disabled>図</button>
<button id="show-source" aria-pressed="false" aria-controls="diagram-source" disabled>Mermaidソース</button>
</div>
<div class="toolbar" role="group" aria-label="図の表示倍率">
<button id="fit-diagram" disabled>全体を表示</button><button id="zoom-in" disabled>拡大</button><button id="zoom-out" disabled>縮小</button><button id="reset-zoom" disabled>100%に戻す</button>
<output id="zoom-value" aria-live="polite" aria-label="表示倍率"></output>
</div>
<p id="diagram-status" role="status">図はありません</p>
<button id="retry-diagram" disabled hidden>図を再試行</button>
<div id="diagram-viewport" role="region" aria-label="JSON構造図の表示領域" aria-describedby="diagram-explanation" tabindex="0"><div id="diagram"></div></div>
<textarea id="diagram-source" aria-label="検証済みMermaidソース" readonly rows="12" wrap="off" hidden></textarea>
</section>
<script type="module" src="/readiness.mjs"></script>
</body></html>
