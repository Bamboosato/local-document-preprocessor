name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the complete Chromium suite
        type: boolean
        default: false
  schedule:
    # Monday 06:00 JST (Sunday 21:00 UTC), before the 07:17 JST collector.
    - cron: '0 21 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  json-prototype:
    name: JSON prototype checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            experiments/json-gates/package-lock.json
      - name: Install root build tools
        run: npm ci
      - name: Install fixed prototype dependencies
        run: npm ci --ignore-scripts
        working-directory: experiments/json-gates
      - name: Audit prototype production and all dependencies
        run: npm run audit:security
        working-directory: experiments/json-gates
      - name: Test parser, deadlines and cache failure boundaries
        if: github.event_name != 'schedule'
        run: npm test
        working-directory: experiments/json-gates
      - name: Test distribution research guards without network access
        if: github.event_name != 'schedule'
        run: |
          npm run test:distribution
          npm run test:sources
        working-directory: experiments/json-gates
      - name: Build both prototype candidates and verify static manifest
        if: github.event_name != 'schedule'
        run: |
          npm run build
          npm run build:readiness
          npm run check:readiness
          npm run build:integration
          npm run check:integration
          npm run build:standard
        working-directory: experiments/json-gates
      - name: Upload prototype audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-prototype-dependency-audit
          path: experiments/json-gates/.security-audit/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # Browser coverage uses the prototype SDK, independently of root E2E.
      - name: Install prototype Chromium
        if: github.event_name != 'schedule'
        run: npx --no-install playwright install --with-deps chromium
        working-directory: experiments/json-gates
      - name: Verify adopted view and update lifecycle sequentially
        if: github.event_name != 'schedule'
        run: node run-adoption-ci.mjs
        working-directory: experiments/json-gates
      - name: Verify isolated product CSP, WASM and JSON contracts sequentially
        if: github.event_name != 'schedule'
        run: node run-integration-check.mjs chromium
        working-directory: experiments/json-gates
      - name: Verify standard Mermaid viewer sequentially
        if: github.event_name != 'schedule'
        run: npm run browser:standard -- chromium
        working-directory: experiments/json-gates
      - name: Upload standard Mermaid evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-mermaid-viewer-evidence
          path: experiments/json-gates/evidence/standard-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload prototype browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-prototype-browser-evidence
          path: |
            experiments/json-gates/evidence/*chromium*.json
            experiments/json-gates/evidence/adoption-chromium-controls.png
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select E2E scope
        id: scope
        env:
          CI_E2E_FULL: ${{ inputs.full_e2e }}
        run: node scripts/ci-e2e-scope.mjs
      - name: Test audit policy and scope selection
        run: npm run test:security
      - name: Audit production and all dependencies
        run: npm run audit:security
      - name: Check document links and structure
        if: github.event_name != 'schedule'
        run: npm run check:docs
      - name: Unit, type check, build and distribution checks
        if: github.event_name != 'schedule'
        run: npm run check
      - name: Install Chromium
        if: github.event_name != 'schedule' && steps.scope.outputs.scope != 'none'
        run: npx --no-install playwright install --with-deps chromium
      - name: Chromium E2E
        id: e2e
        if: github.event_name != 'schedule' && steps.scope.outputs.scope != 'none'
        env:
          E2E_SCOPE: ${{ steps.scope.outputs.scope }}
          E2E_GREP: ${{ steps.scope.outputs.grep }}
        run: |
          if [ "$E2E_SCOPE" = targeted ]; then
            npm run test:e2e -- --workers=1 --grep "$E2E_GREP"
          else
            npm run test:e2e -- --workers=1
          fi
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: .security-audit/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload synthetic-fixture E2E failure evidence
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-evidence
          path: test-results/
          retention-days: 7
      - name: Record verification scope
        if: always()
        env:
          E2E_SCOPE: ${{ steps.scope.outputs.scope }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo '### Verification scope'
            printf 'E2E selection: %s (%s)\n\n' "$E2E_SCOPE" "$SCOPE_REASON"
            printf 'E2E outcome: %s\n\n' "$E2E_OUTCOME"
            echo 'Chromium only; Edge, Safari, physical devices and offline/install/update behavior are not verified.'
            echo 'Scheduled runs perform dependency auditing only.'
          } >> "$GITHUB_STEP_SUMMARY"
